services:
  postgres:
    image: postgres:16-alpine
    container_name: edalat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edalat
      POSTGRES_PASSWORD: edalat
      POSTGRES_DB: edalat_filter
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edalat -d edalat_filter']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edalat-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  # S3-compatible object storage for product images, logos, packaging files
  minio:
    image: minio/minio:latest
    container_name: edalat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: edalat
      MINIO_ROOT_PASSWORD: edalat123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
